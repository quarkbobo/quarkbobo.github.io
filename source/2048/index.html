<script id="rules2048">
function calculateMove(board, direction) {
  const grid = Array.from({ length: 4 }, () => [0, 0, 0, 0]);
  const slides = [], merges = [];
  let gain = 0;
  const position = (line, index) => direction === 'left' ? [line, index] : direction === 'right' ? [line, 3 - index] : direction === 'up' ? [index, line] : [3 - index, line];
  for (let line = 0; line < 4; line++) {
    const entries = [];
    for (let index = 0; index < 4; index++) {
      const from = position(line, index), value = board[from[0]][from[1]];
      if (value) entries.push({ value, from });
    }
    let destination = 0;
    for (let index = 0; index < entries.length; index++) {
      const entry = entries[index], to = position(line, destination++);
      let value = entry.value;
      slides.push({ ...entry, to });
      if (entries[index + 1]?.value === value) {
        slides.push({ ...entries[++index], to });
        value *= 2;
        gain += value;
        merges.push({ row: to[0], column: to[1], value });
      }
      grid[to[0]][to[1]] = value;
    }
  }
  return { grid, slides, merges, gain, changed: grid.some((row, r) => row.some((value, c) => value !== board[r][c])) };
}
function hasWon(board) { return board.some(row => row.some(value => value >= 2048)); }
function isGameOver(board) {
  return board.every((row, r) => row.every((value, c) => value !== 0 && (c === 3 || value !== row[c + 1]) && (r === 3 || value !== board[r + 1][c])));
}
</script>
<script>

const board2048 = document.getElementById('board2048');
const tiles2048 = document.getElementById('tiles2048');
const effects2048 = document.getElementById('effects2048');
const overlay2048 = document.getElementById('overlay2048');

  const [row, column] = empty[Math.floor(Math.random() * empty.length)];
  game2048.grid[row][column] = Math.random() < .9 ? 2 : 4;

}
