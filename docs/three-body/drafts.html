*{box-sizing:border-box}body{margin:0;background:var(--space);color:var(--text);font:14px/1.65 var(--body)}a{color:inherit;text-decoration:none}a:focus-visible{outline:2px solid var(--cyan);outline-offset:5px}button{font:inherit}svg.defs{position:absolute;width:0;height:0;overflow:hidden}.draft-bar{padding:14px 4%;display:flex;align-items:center;gap:26px;border-bottom:1px solid var(--edge);background:#0d1522}.draft-bar strong{font-size:12px;font-weight:400;color:#a9bbca}.draft-bar nav{display:flex;gap:24px;margin-left:auto;font-size:12px}.draft-bar a[aria-current]{color:var(--cyan);border-bottom:1px solid var(--cyan)}.sheet{max-width:1600px;margin:auto}.draft{display:none}.draft.is-active{display:block}.site-head{display:flex;align-items:center;justify-content:space-between;padding:20px 4%;border-bottom:1px solid #1b2a3b}.brand{font-family:var(--display);font-size:23px;letter-spacing:.05em}.site-links{display:flex;gap:30px;font-size:12px;color:#aab9c9}.site-links b{font-weight:400;color:var(--cyan)}.observatory{position:relative;height:700px;overflow:hidden;background:#050914}.status{position:absolute;top:30px;left:5%;right:5%;display:flex;align-items:start;justify-content:space-between;z-index:3;pointer-events:none}.kicker{font:10px/1.4 var(--data);letter-spacing:.2em;color:#91adbe}.status h1{margin:7px 0 0;font:normal 27px/1.3 var(--display);letter-spacing:.1em}.epoch{text-align:right}.year{font:28px/1.2 var(--data)}.year small{font-size:12px;color:#8ba1b5}.epoch p{margin:8px 0;color:var(--cyan);font-size:11px}.window{position:absolute;inset:106px 3% 95px;border:1px solid #3b5268;border-radius:90px 90px 24px 24px;overflow:hidden;background:radial-gradient(ellipse at 48% 65%,#0b182b,transparent 60%),#030710;box-shadow:0 0 0 9px #0b1523,0 0 0 10px #1b2c3d,inset 0 0 70px #000}.window::after{position:absolute;inset:0;content:"";pointer-events:none;background:linear-gradient(110deg,#92d9e50a,transparent 26%,transparent 76%,#efb66e04);box-shadow:inset 0 0 45px #01040bb0 <header class="draft-bar"><strong>构图草稿 · 示意画面，不是产品截图</strong><nav aria-label="构图方案"><a href="?design=panoramic" data-design="panoramic">全景舷窗</a><a href="?design=ring" data-design="ring">环形观察舱</a><a href="?design=bridge" data-design="bridge">偏置舰桥</a></nav></header>
<main class="sheet" id="draft-sheet"></main>
<template id="draft-template"><article class="draft is-active"><header class="site-head"><a class="brand" href="#">Quarkbobo</a><nav class="site-links"><span class="optional">文章</span><span class="optional">归档</span><b>三体观测</b><span>旧主题 ↗</span></nav></header><section class="observatory"><div class="status"><div><div class="kicker">THREE-BODY OBSERVATORY</div><h1>在群星之间</h1></div><div class="epoch"><div class="year">2000 <small>年</small></div><p>文明 001 · 观测开始</p></div></div><div class="window"><svg class="universe" viewBox="0 0 1000 480" role="img" aria-label="三颗恒星、一颗行星及世界坐标轨迹的构图示意"><use href="#universe"/></svg><span class="window-tick"></span><div class="scene-label">STATION VIEW / 空间站总览</div></div><div class="beam"></div><div class="beam right"></div><div class="console"><div class="formula" aria-label="公式展示位置"><span>F = Gm₁m₂/r²</span><span>a = F/m</span><span>I = ΣL/4πr²</span></div><div class="controls"><span class="control active">空间站 ▾</span><span class="control">约束观测</span><span class="control">暂停</span><span class="control">调节参数</span></div></div></section><section class="read"><div><h2>继续阅读</h2><p>保留每一个好奇，记录每一次探索。</p></div><a href="#">最新记录 ↓</a></section><p class="proposal"></p></article></template>
<script>
const designs={panoramic:{name:'全景舷窗 · 采用方案',text:'四角舱体与窄观测台包围完整星域。桌面展开为宽窗，手机保留竖向观测面与窗下操作。'},ring:{name:'环形观察舱',text:'圆形结构强调置身空间站的感受；四角留作状态区，移动端把状态与操作落到圆窗外。'},bridge:{name:'偏置舰桥',text:'观测信息在左，天体在右；斜向结构形成舰桥纵深，手机将状态区移到舷窗下。'}};
const key=new URLSearchParams(location.search).get('design');const chosen=Object.hasOwn(designs,key)?key:'panoramic';const fragment=document.querySelector('#draft-template').content.cloneNode(true);fragment.querySelector('article').classList.add(chosen);fragment.querySelector('.proposal').textContent=designs[chosen].name+' — '+designs[chosen].text;document.querySelector('#draft-sheet').append(fragment);document.querySelector('[data-design="'+chosen+'"]').setAttribute('aria-current','page');document.title=designs[chosen].name+' · 构图草稿';
