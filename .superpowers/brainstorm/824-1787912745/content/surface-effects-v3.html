<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星球表面流光方案</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:42px 4vw;background:radial-gradient(circle at 50% -20%,#17235e 0,transparent 42%),#02040b;color:#edf6ff;font-family:"Microsoft YaHei",sans-serif}h1{font:300 clamp(30px,4vw,54px) Georgia,"Songti SC",serif;margin:8px 0}.meta{color:#70eaff;font:10px Consolas;letter-spacing:.25em}.intro{color:#8da0b7;margin-bottom:28px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;max-width:1200px;margin:auto}.top{max-width:1200px;margin:auto}.card{position:relative;min-height:550px;border:1px solid #293954;background:#070b16;border-radius:18px;overflow:hidden;cursor:pointer;transition:.35s}.card:hover{transform:translateY(-7px);border-color:#70eaff;box-shadow:0 24px 80px #6d45ff24}.card.selected{border-color:#70eaff;box-shadow:0 0 0 2px #70eaff44,0 24px 80px #6d45ff2f}.stage{height:395px;display:grid;place-items:center;position:relative;overflow:hidden;background-image:radial-gradient(#fff 0 .7px,transparent 1px);background-size:31px 31px}.planet{position:relative;width:230px;height:230px;border-radius:50%;overflow:hidden;box-shadow:inset -30px -22px 48px #01020ae8,inset 12px 8px 22px #d9fbff3d,0 0 18px #78e9ff99,0 0 62px #6545ff88,0 0 115px #4a31b344;transition:.45s}.card:hover .planet{transform:scale(1.04) rotate(2deg)}.planet:after{content:"";position:absolute;inset:0;border-radius:50%;background:linear-gradient(115deg,#e7fcff60,transparent 20%,transparent 57%,#01020bdc 79%);z-index:6}.ring{position:absolute;width:350px;height:70px;border:1px solid #8deaffaa;border-radius:50%;transform:rotate(-15deg);box-shadow:0 0 11px #71dfff44}.aurora{background:radial-gradient(circle at 28% 22%,#e5ffff,#4fdff4 9%,#3758c8 28%,#522188 49%,#100b35 69%,#02030a 80%)}.aurora:before{content:"";position:absolute;inset:-40%;background:repeating-conic-gradient(from 20deg at 48% 48%,transparent 0 8deg,#56fff238 11deg,#9f5cff72 15deg,transparent 21deg);filter:blur(7px);mix-blend-mode:screen;animation:aurora 7s ease-in-out infinite alternate}.pulse{background:radial-gradient(circle at 30% 25%,#bdfaff,#327ede 14%,#28276f 45%,#0c0a29 70%)}.pulse:before{content:"";position:absolute;inset:-25%;border-radius:50%;background:repeating-radial-gradient(ellipse at 36% 35%,transparent 0 15px,#6ff8ff77 17px,#6f5cff44 19px,transparent 23px);transform:rotate(-25deg);filter:blur(1px);animation:pulse 3.2s ease-in-out infinite;mix-blend-mode:screen}.pulse .longitude{position:absolute;inset:5%;border-radius:50%;background:repeating-linear-gradient(92deg,transparent 0 27px,#a1f9ff3c 28px,transparent 30px);animation:drift 8s linear infinite;z-index:3}.storm{background:radial-gradient(circle at 29% 20%,#dffcff,#5caeef 10%,#4a319a 30%,#241451 54%,#08051a 75%)}.storm:before{content:"";position:absolute;inset:-35%;background:repeating-linear-gradient(168deg,transparent 0 17px,#75ecff5c 21px,#7b3fe56b 27px,transparent 36px);filter:blur(4px);transform:rotate(12deg);animation:storm 4.5s linear infinite;mix-blend-mode:screen}.storm .spark{position:absolute;left:23%;top:34%;width:42%;height:2px;background:#e7ffff;box-shadow:0 0 7px #fff,0 0 18px #62efff;transform:rotate(-24deg);clip-path:polygon(0 40%,28% 40%,36% 0,48% 100%,58% 38%,100% 38%,100% 62%,62% 62%,48% 100%,34% 55%,0 60%);animation:spark 2.6s steps(1) infinite;z-index:4}.info{padding:19px 21px 24px}.info h2{font-size:17px;margin:0 0 8px}.info p{font-size:13px;line-height:1.7;color:#8fa1b7;margin:0}.tag{font:9px Consolas;letter-spacing:.12em;color:#6ceaff;margin-bottom:8px}@keyframes aurora{0%{transform:rotate(0) scale(.95)}100%{transform:rotate(45deg) scale(1.15)}}@keyframes pulse{50%{transform:scale(1.12);opacity:.55}}@keyframes drift{to{transform:translateX(30px)}}@keyframes storm{to{transform:rotate(12deg) translateY(36px)}}@keyframes spark{0%,88%,100%{opacity:0}89%,92%{opacity:1}}@media(max-width:850px){.grid{grid-template-columns:1fr}.stage{height:330px}.card{min-height:auto}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><div class="top"><div class="meta">Q-01 / SURFACE PHENOMENA TEST</div><h1>选择星球表面的“生命感”</h1><p class="intro">把鼠标移到球体上观察。最终会再叠加轻微鼠标视差与星尘响应。</p></div><div class="grid">
<article class="card" data-choice="aurora" onclick="toggleSelect(this)"><div class="stage"><div class="ring"></div><div class="planet aurora"></div></div><div class="info"><div class="tag">A / LIQUID AURORA</div><h2>液态极光</h2><p>蓝紫光带贴着球面缓慢游动，像液态能量在内部循环。高级、柔和，最适合长期观看。</p></div></article>
<article class="card" data-choice="pulse" onclick="toggleSelect(this)"><div class="stage"><div class="ring"></div><div class="planet pulse"><div class="longitude"></div></div></div><div class="info"><div class="tag">B / GRID PULSE</div><h2>经纬脉冲</h2><p>球面纹路周期性扩散，网格缓慢漂移。信息感和科幻仪器感更强，节奏清晰。</p></div></article>
<article class="card" data-choice="storm" onclick="toggleSelect(this)"><div class="stage"><div class="ring"></div><div class="planet storm"><div class="spark"></div></div></div><div class="info"><div class="tag">C / MAGNETIC STORM</div><h2>磁暴云带</h2><p>流动云层中偶发一次短促电弧。戏剧性最强，但会控制闪烁频率，避免喧宾夺主。</p></div></article>
</div></body></html>
