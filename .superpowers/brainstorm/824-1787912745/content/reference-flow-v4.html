<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quark 粒子流动原型</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#010208;color:#eef6ff;font-family:"Microsoft YaHei",sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%}.shade{position:fixed;inset:0;background:radial-gradient(circle at 76% 37%,transparent 0 15%,#05072015 32%,#010208b8 78%);pointer-events:none}.nav{position:fixed;z-index:4;left:0;right:0;top:0;padding:28px 5vw;display:flex;justify-content:space-between;font:10px Consolas;letter-spacing:.22em;color:#9db2ca}.brand{color:#72eaff}.copy{position:fixed;z-index:4;left:7vw;top:29%;width:min(570px,55vw);pointer-events:none}.meta{font:10px Consolas;letter-spacing:.24em;color:#6ce7fa}.copy h1{margin:20px 0;font:300 clamp(52px,7vw,100px)/.92 Georgia,"Songti SC",serif;letter-spacing:-.055em}.copy p{max-width:400px;color:#8da0b7;line-height:1.8;font-size:14px}.note{position:fixed;z-index:5;right:24px;bottom:22px;padding:12px 15px;border:1px solid #334362;border-radius:12px;background:#07101ed6;color:#a9bed5;font:11px Consolas;cursor:pointer;backdrop-filter:blur(12px)}.note.selected{border-color:#72eaff;color:#fff}.note b{color:#70eaff;font-weight:400}.legend{position:fixed;z-index:4;left:7vw;bottom:32px;font:9px Consolas;letter-spacing:.16em;color:#5e738e}.legend span{margin-right:20px}.legend i{display:inline-block;width:20px;height:1px;vertical-align:middle;margin-right:6px;background:#77eaff;box-shadow:0 0 8px #76eaff}@media(max-width:760px){.copy{top:20%;width:85vw}.copy h1{font-size:55px}.copy p{width:70%}.nav span:last-child{display:none}.legend{display:none}}
</style></head><body><canvas id="fx"></canvas><div class="shade"></div><nav class="nav"><span class="brand">Q / LOG</span><span>文章　实验　关于</span></nav><section class="copy"><div class="meta">PERSONAL ARCHIVE · DEEP SPACE SIGNAL</div><h1>在噪声里<br>保留信号。</h1><p>粒子沿天体引力轨道流动。移动鼠标会轻微扰动轨迹，但整体流向始终保持稳定。</p></section><div class="legend"><span><i></i>ORBIT DUST</span><span><i style="background:#a873ff"></i>ENERGY TRAIL</span></div><div class="note" data-choice="reference-flow-approved" onclick="toggleSelect(this)"><b>LIVE PROTOTYPE</b>　✓ 采用这个流动方向</div><script>
const c=document.getElementById('fx'),x=c.getContext('2d');let w,h,d=Math.min(devicePixelRatio,2),mx=.5,my=.5,ps=[];function size(){w=innerWidth;h=innerHeight;c.width=w*d;c.height=h*d;x.setTransform(d,0,0,d,0,0);spawn()}addEventListener('resize',size);addEventListener('pointermove',e=>{mx=e.clientX/w;my=e.clientY/h});
function spawn(){ps=[];let n=w<700?130:260;for(let i=0;i<n;i++)ps.push({t:Math.random(),v:.00025+Math.random()*.0014,l:1+Math.random()*3,a:.15+Math.random()*.85,s:.5+Math.random()*1.7,band:Math.random()<.58?0:Math.random()<.8?1:2,hue:Math.random()<.72?190:255})}
function bez(t,p0,p1,p2){let q=1-t;return q*q*p0+2*q*t*p1+t*t*p2}function point(p,t){let cx=w*(.34+mx*.025),cy=h*(1.04+my*.018),ex=w*(1.03+mx*.01),ey=h*(.18+my*.025),lift=p.band===0?.59:p.band===1?.72:.43;return{x:bez(t,-w*.13,cx,ex),y:bez(t,h*(.83+p.band*.025),h*lift,ey)}}
function planet(){let px=w*.79+(mx-.5)*11,py=h*.32+(my-.5)*8,r=Math.min(w,h)*.18,g=x.createRadialGradient(px-r*.35,py-r*.38,2,px,py,r);g.addColorStop(0,'#e8feff');g.addColorStop(.08,'#80e8ff');g.addColorStop(.3,'#4e54d9');g.addColorStop(.55,'#542180');g.addColorStop(.78,'#100a30');g.addColorStop(1,'#010208');x.save();x.shadowBlur=48;x.shadowColor='#6651ff';x.fillStyle=g;x.beginPath();x.arc(px,py,r,0,Math.PI*2);x.fill();x.clip();for(let i=0;i<7;i++){x.strokeStyle=`rgba(${90+i*8},${210-i*12},255,${.07+i*.012})`;x.lineWidth=5+i*1.7;x.beginPath();x.ellipse(px-r*.05,py-r*.1+i*r*.035,r*1.05,r*(.22+i*.025),-.35,0,Math.PI*2);x.stroke()}x.restore();x.strokeStyle='#9eeeff99';x.lineWidth=1.2;x.shadowBlur=10;x.shadowColor='#78eaff';x.beginPath();x.ellipse(px,py+r*.13,r*1.72,r*.28,-.18,0,Math.PI*2);x.stroke();x.shadowBlur=0}
function draw(){x.clearRect(0,0,w,h);let bg=x.createRadialGradient(w*.78,h*.31,0,w*.78,h*.31,h*.8);bg.addColorStop(0,'#151052');bg.addColorStop(.32,'#050a22');bg.addColorStop(1,'#010208');x.fillStyle=bg;x.fillRect(0,0,w,h);for(let i=0;i<110;i++){let sx=(i*83%997)/997*w,sy=(i*47%503)/503*h;x.fillStyle=`rgba(190,225,255,${.08+(i%7)*.025})`;x.fillRect(sx,sy,1,1)}planet();x.globalCompositeOperation='lighter';for(const p of ps){p.t=(p.t+p.v)%1;let q=point(p,p.t),prev=point(p,Math.max(0,p.t-p.v*(14+p.l*9))),fade=Math.sin(p.t*Math.PI);x.strokeStyle=`hsla(${p.hue},100%,${p.hue===190?72:70}%,${p.a*fade})`;x.lineWidth=p.s;x.shadowBlur=8+p.s*5;x.shadowColor=p.hue===190?'#65e9ff':'#8b5dff';x.beginPath();x.moveTo(prev.x,prev.y);x.lineTo(q.x,q.y);x.stroke();if(p.s>1.45){x.fillStyle='#eaffff';x.beginPath();x.arc(q.x,q.y,p.s*.7,0,7);x.fill()}}x.globalCompositeOperation='source-over';x.shadowBlur=0;requestAnimationFrame(draw)}size();draw();
</script></body></html>
