<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quark 粒子流 · 平滑版</title><style>
:root{--px:0;--py:0}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#010208;color:#eef6ff;font-family:"Microsoft YaHei",sans-serif}body{background:radial-gradient(circle at 79% 31%,#171052 0,transparent 29%),radial-gradient(ellipse at 48% 92%,#10133a 0,transparent 52%),#010208}canvas{position:fixed;inset:0;width:100%;height:100%}.planet-system{position:fixed;z-index:1;right:2vw;top:-4vh;width:min(58vw,720px);aspect-ratio:1;transform:translate3d(calc(var(--px)*9px),calc(var(--py)*7px),0);transition:transform .15s linear;pointer-events:none}.halo{position:absolute;inset:15%;border-radius:50%;background:radial-gradient(circle,#745aff2d 0 34%,#60dfff18 49%,transparent 69%);filter:blur(24px);animation:halo 7s ease-in-out infinite}.planet{position:absolute;inset:26%;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 31% 24%,#e8ffff 0 2%,#77eaff 7%,#526be0 23%,#522488 48%,#14103d 68%,#02030b 80%);box-shadow:inset -38px -32px 66px #010208e8,inset 11px 8px 24px #d7fbff4a,0 0 20px #7deaff95,0 0 72px #6347ff72,0 0 145px #4e35c23d}.surface{position:absolute;inset:-48%;background:repeating-conic-gradient(from 12deg at 48% 48%,transparent 0 7deg,#63f5ff29 10deg,#9b63ff51 14deg,transparent 21deg);mix-blend-mode:screen;filter:blur(5px);animation:surface 14s linear infinite}.bands{position:absolute;inset:-30%;background:repeating-radial-gradient(ellipse at 43% 38%,transparent 0 16px,#b9f5ff12 19px,#7751ff22 22px,transparent 28px);transform:rotate(-27deg);animation:bands 8s ease-in-out infinite alternate}.terminator{position:absolute;inset:0;border-radius:50%;background:linear-gradient(112deg,#e7fdff54,transparent 18%,transparent 57%,#010208df 80%)}.ring{position:absolute;left:11%;right:3%;top:47%;height:13%;border:1px solid #a2efff9c;border-left-color:#7558ff58;border-radius:50%;transform:rotate(-15deg);box-shadow:0 0 9px #72eaff55}.nav{position:fixed;z-index:4;left:0;right:0;top:0;padding:28px 5vw;display:flex;justify-content:space-between;font:10px Consolas;letter-spacing:.22em;color:#9db2ca}.brand{color:#72eaff}.copy{position:fixed;z-index:4;left:7vw;top:29%;width:min(580px,57vw);pointer-events:none}.meta{font:10px Consolas;letter-spacing:.24em;color:#6ce7fa}.copy h1{margin:20px 0;font:300 clamp(52px,7vw,100px)/.92 Georgia,"Songti SC",serif;letter-spacing:-.055em}.copy p{max-width:400px;color:#8da0b7;line-height:1.8;font-size:14px}.status{position:fixed;z-index:6;right:22px;top:21px;display:flex;gap:8px;align-items:center;color:#698098;font:9px Consolas;letter-spacing:.1em}.fps{color:#71eaff}.approval{position:fixed;z-index:7;right:22px;bottom:20px;padding:12px 15px;border:1px solid #344866;border-radius:11px;background:#07101edb;color:#a9bed5;font:11px Consolas;cursor:pointer;backdrop-filter:blur(12px)}.approval.selected{border-color:#72eaff;color:#fff}.legend{position:fixed;z-index:4;left:7vw;bottom:28px;font:9px Consolas;letter-spacing:.14em;color:#5b708a}.legend span{margin-right:18px}.legend i{display:inline-block;width:22px;height:1px;vertical-align:middle;margin-right:6px;background:#73eaff;box-shadow:0 0 7px #73eaff}@keyframes surface{to{transform:rotate(360deg)}}@keyframes bands{to{transform:rotate(-23deg) scale(1.08)}}@keyframes halo{50%{transform:scale(1.06);opacity:.72}}@media(max-width:760px){.planet-system{width:760px;right:-350px;top:5vh}.copy{top:21%;width:86vw}.copy h1{font-size:55px}.copy p{width:68%}.nav span:last-child,.legend{display:none}.status{top:auto;bottom:22px;left:22px;right:auto}}@media(prefers-reduced-motion:reduce){.surface,.bands,.halo{animation:none}.status{display:none}}
</style></head><body><div class="planet-system"><div class="halo"></div><div class="ring"></div><div class="planet"><div class="surface"></div><div class="bands"></div><div class="terminator"></div></div></div><canvas id="particles"></canvas><nav class="nav"><span class="brand">Q / LOG</span><span>文章　实验　关于</span></nav><section class="copy"><div class="meta">PERSONAL ARCHIVE · DEEP SPACE SIGNAL</div><h1>在噪声里<br>保留信号。</h1><p>流尘沿引力轨道缓慢漂移，极少数高能粒子会突然越过视野。移动鼠标，只会轻轻改变宇宙的呼吸。</p></section><div class="legend"><span><i></i>AMBIENT DUST</span><span><i style="background:#a879ff"></i>RARE ENERGY STREAK</span></div><div class="status"><span>RENDER</span><span class="fps" id="fps">-- FPS</span></div><div class="approval" data-choice="smooth-flow-approved" onclick="toggleSelect(this)">✓ 采用平滑粒子流</div><script>
const canvas=document.getElementById('particles'),ctx=canvas.getContext('2d',{alpha:true});let W=0,H=0,DPR=1,particles=[],pointer={x:0,y:0,tx:0,ty:0},last=performance.now(),fpsFrames=0,fpsStamp=last;const fpsEl=document.getElementById('fps'),reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function sprite(color){const s=document.createElement('canvas');s.width=s.height=40;const g=s.getContext('2d'),r=g.createRadialGradient(20,20,0,20,20,20);r.addColorStop(0,'#fff');r.addColorStop(.11,color);r.addColorStop(.38,color+'99');r.addColorStop(1,color+'00');g.fillStyle=r;g.fillRect(0,0,40,40);return s}const cyan=sprite('#67eaff'),violet=sprite('#9568ff');
function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,1.5);canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);const count=reduced?0:Math.max(110,Math.min(230,Math.round(W*H/5200)));particles=Array.from({length:count},(_,i)=>makeParticle(i/count))}
function makeParticle(offset=Math.random()){const rare=Math.random()<.045,mid=!rare&&Math.random()<.22;return{phase:offset,life:rare ? 2.2+Math.random()*1.7 : mid ? 7+Math.random()*5 : 14+Math.random()*12,size:rare ? 1.5+Math.random()*1.7 : mid ? .7+Math.random()*.8 : .25+Math.random()*.65,alpha:rare ? .62+Math.random()*.3 : mid ? .25+Math.random()*.38 : .11+Math.random()*.25,band:Math.floor(Math.random()*4),jitter:(Math.random()-.5),rare,mid,color:Math.random()<.78 ? cyan : violet,wave:Math.random()*6.28}}
function cubic(t,a,b,c,d){const q=1-t;return q*q*q*a+3*q*q*t*b+3*q*t*t*c+t*t*t*d}function pos(p,t){const b=p.band,j=p.jitter;const sx=-W*.12,sy=H*(.82+b*.014+j*.06);const c1x=W*(.16+b*.018),c1y=H*(.73+j*.09);const c2x=W*(.70-b*.04),c2y=H*(.84-b*.105+j*.07);const ex=W*1.07,ey=H*(.12+b*.095+j*.05);const drift=Math.sin(t*6.28+p.wave)*(p.rare?1.5:3.2);return{x:cubic(t,sx,c1x,c2x,ex)+drift+pointer.x*(5+b*1.5),y:cubic(t,sy,c1y,c2y,ey)+drift*.34+pointer.y*(3+b)}}
function smooth(t){return t*t*(3-2*t)}function paint(now){const dt=Math.min((now-last)/1000,.05);last=now;pointer.x+=(pointer.tx-pointer.x)*(1-Math.pow(.001,dt));pointer.y+=(pointer.ty-pointer.y)*(1-Math.pow(.001,dt));ctx.clearRect(0,0,W,H);const sec=now/1000;for(const p of particles){let t=(sec/p.life+p.phase)%1;const eased=p.rare?smooth(t):t;const q=pos(p,eased),tail=pos(p,Math.max(0,eased-(p.rare?.055:p.mid?.018:.006)));const edge=Math.min(1,t/.1,(1-t)/.13),a=p.alpha*Math.max(0,edge);if(a<=.01)continue;ctx.globalAlpha=a;if(p.rare){const grad=ctx.createLinearGradient(tail.x,tail.y,q.x,q.y);grad.addColorStop(0,'rgba(104,111,255,0)');grad.addColorStop(.68,'rgba(108,224,255,.28)');grad.addColorStop(1,'rgba(231,253,255,.92)');ctx.strokeStyle=grad;ctx.lineWidth=p.size*.72;ctx.beginPath();ctx.moveTo(tail.x,tail.y);ctx.lineTo(q.x,q.y);ctx.stroke()}const z=p.size*(p.rare?18:p.mid?12:9);ctx.drawImage(p.color,q.x-z/2,q.y-z/2,z,z)}ctx.globalAlpha=1;fpsFrames++;if(now-fpsStamp>=1000){const measured=Math.round(fpsFrames*1000/(now-fpsStamp));fpsEl.textContent=measured+' FPS';console.info('quark-fps',measured);fpsFrames=0;fpsStamp=now}requestAnimationFrame(paint)}
addEventListener('pointermove',e=>{pointer.tx=e.clientX/W-.5;pointer.ty=e.clientY/H-.5;document.documentElement.style.setProperty('--px',pointer.tx);document.documentElement.style.setProperty('--py',pointer.ty)},{passive:true});addEventListener('resize',resize,{passive:true});resize();requestAnimationFrame(paint);
const frontRing=document.querySelector('.ring').cloneNode(false);frontRing.classList.add('front-ring');document.querySelector('.planet-system').append(frontRing);
</script><style>
.planet-system{right:0;top:-2vh;width:min(63vw,780px)}
.halo{inset:14%;background:radial-gradient(ellipse,#7659ff31 0 28%,#60ddff17 49%,transparent 70%)}
.planet{inset:auto;left:30%;top:29%;width:43%;height:38%;z-index:2;border-radius:50%;transform:rotate(-4deg);background:radial-gradient(ellipse at 30% 23%,#e9ffff 0 2%,#91e9ff 6%,#6279df 18%,#554196 37%,#29215e 56%,#0d0a28 73%,#02030b 88%);box-shadow:inset -44px -29px 62px #010208ef,inset 16px 9px 28px #d9fbff42,0 0 18px #7be7ff8f,0 0 68px #684cff66,0 0 135px #4d34bd36}
.surface{inset:-20%;background:repeating-linear-gradient(174deg,transparent 0 13px,#baf6ff1f 17px,#7e69ff35 22px,transparent 29px);background-size:160% 130%;mix-blend-mode:screen;filter:blur(2.5px);animation:saturn-flow 11s ease-in-out infinite alternate}
.bands{inset:-10%;background:repeating-linear-gradient(177deg,transparent 0 19px,#d0f9ff12 22px,#5941aa2b 29px,transparent 36px);filter:blur(1px);transform:none;animation:saturn-bands 16s linear infinite}
.terminator{background:linear-gradient(108deg,#efffff5c 0,transparent 17%,transparent 55%,#07051aab 72%,#010208eb 92%);box-shadow:inset 8px 0 12px #9feeff43}
.ring{left:2%;right:1%;top:40%;height:22%;z-index:1;border:0;border-radius:50%;transform:rotate(-14deg);clip-path:inset(0 0 50% 0);background:radial-gradient(ellipse at center,transparent 0 36%,#94eaff29 37%,#a6f3ff8a 38%,transparent 39.5%,#6a55d84d 41%,#c4f7ffb8 43%,#8071e887 44%,transparent 45.5%,#97e7ff71 47%,#5f47c54d 48%,transparent 50%);box-shadow:none;filter:drop-shadow(0 0 8px #68dfff60)}
.ring.front-ring{z-index:3;clip-path:inset(50% 0 0 0);opacity:.96;filter:drop-shadow(0 2px 7px #6ce9ff80)}

</style></body></html>
